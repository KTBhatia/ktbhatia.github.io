<div class="post-card" style="border-top: 4px solid #0077B5; margin-bottom: 40px;">
  {% if post.featured_image %}
    <img src="{{ post.featured_image | relative_url }}" style="width: 100%; height: 250px; object-fit: cover;">
  {% endif %}
  <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
  <p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
</div>
