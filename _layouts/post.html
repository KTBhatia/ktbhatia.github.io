---
layout: default
---
<article class="post wrap">
  <div class="post__eyebrow">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
    {% if page.tags.size > 0 %}<span class="tag">{{ page.tags | first }}</span>{% endif %}
    <span>·</span>
    <span>{{ content | number_of_words | divided_by: 200 | at_least: 1 }} min read</span>
  </div>

  <h1>{{ page.title }}</h1>

  <div class="post__body">
    {{ content }}
  </div>

  <div class="post-footer">
    <a href="{{ '/' | relative_url }}">&larr; back to index</a>
    <a href="https://github.com/{{ site.github_username | default: 'KTBhatia' }}/{{ site.github_username | default: 'KTBhatia' }}.github.io/edit/main/{{ page.path }}">edit on github</a>
  </div>
</article>
